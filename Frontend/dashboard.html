<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlotSync • User Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/img/SlotSync_2.png">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- ================= FIREBASE ================= -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="assets/js/firebase.js"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:"#070911",
        panel:"rgba(255,255,255,0.06)",
        stroke:"rgba(255,255,255,0.12)",
        primary:"#7c7cff",
        green:"#2bff88",
        red:"#ff4d6d",
        text:"#e5e7eb",
        muted:"#9ca3af"
      }
    }
  }
}
</script>
</head>

<body class="bg-bg text-text">

<!-- Background Glow -->
<div class="fixed inset-0 -z-10">
  <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-primary/20 blur-[180px]"></div>
  <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-fuchsia-600/10 blur-[180px]"></div>
</div>

<div class="max-w-7xl mx-auto px-6 py-8">

<!-- HEADER -->
<header class="flex justify-between items-center mb-12">
  <div>
    <h1 class="text-2xl font-semibold">🚗 SlotSync Dashboard</h1>
    <p id="userEmail" class="text-muted text-sm"></p>
  </div>

  <button id="logoutBtn"
    class="px-4 py-2 rounded-lg border border-primary/40 text-primary text-sm hover:bg-primary/10">
    Logout
  </button>
</header>

<!-- STATS -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">

<div class="card">
<p class="label">TOTAL SLOTS</p>
<h2 id="totalSlots" class="value">0</h2>
</div>

<div class="card">
<p class="label">AVAILABLE</p>
<h2 id="availableSlots" class="value text-green">0</h2>
</div>

<div class="card">
<p class="label">OCCUPIED</p>
<h2 id="occupiedSlots" class="value text-red">0</h2>
</div>

<div class="card">
<p class="label">YOUR STATUS</p>
<h2 id="userStatus" class="value text-primary">Idle</h2>
</div>

</section>

<!-- PARK VEHICLE -->
<section class="card mb-12">
<h3 class="section-title">Park Vehicle</h3>

<div class="flex gap-4 flex-col md:flex-row">
<input id="vehicleNumber" placeholder="Vehicle Number"
class="input">

<button onclick="parkVehicle()" class="btn btn-green">
Park
</button>

<button onclick="removeVehicle()" class="btn btn-red">
Remove
</button>
</div>
</section>

<!-- SLOT GRID -->
<section class="mb-14">
<h3 class="section-title mb-4">Live Parking Grid</h3>
<div id="slotGrid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-5"></div>
</section>

<!-- HISTORY -->
<section>
<h3 class="section-title mb-4">Your Parking History</h3>
<div id="historyList" class="space-y-3"></div>
</section>

</div>

<!-- UI STYLES -->
<style>
.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.12);
border-radius:1.4rem;
padding:1.6rem;
transition:.35s ease;
}
.card:hover{
transform:translateY(-6px);
box-shadow:0 25px 60px rgba(0,0,0,.6);
}
.label{
font-size:.7rem;
letter-spacing:.2em;
color:#9ca3af;
}
.value{
font-size:1.7rem;
font-weight:600;
}
.section-title{
font-size:1.05rem;
letter-spacing:.14em;
text-transform:uppercase;
color:#c7d2fe;
margin-bottom:1rem;
}
.input{
flex:1;
padding:1rem;
border-radius:1rem;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
}
.btn{
padding:1rem 1.6rem;
border-radius:1rem;
font-weight:600;
transition:.25s ease;
}
.btn-green{ background:linear-gradient(135deg,#2bff88,#16c172); }
.btn-red{ background:linear-gradient(135deg,#ff4d6d,#ec4899); }
.btn:hover{ transform:scale(1.05); }
.slot{
padding:1.4rem;
border-radius:1rem;
text-align:center;
font-weight:600;
border:1px solid rgba(255,255,255,0.15);
}
.free{ background:rgba(43,255,136,0.15); }
.occupied{ background:rgba(255,77,109,0.15); }
</style>

<!-- DASHBOARD LOGIC -->
<script src="assets/js/dashboard.js"></script>

</body>
</html>
