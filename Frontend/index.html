<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Car Parking System</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen">

<div class="max-w-6xl mx-auto p-6">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-bold text-slate-800">
                🚗 Smart Car Parking System
            </h1>
            <p class="text-slate-500">
                Modern parking slot management dashboard
            </p>
        </div>
        <span class="mt-4 sm:mt-0 px-4 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">
            Live Status
        </span>
    </header>

    <!-- Stats -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow p-5 text-center">
            <p class="text-slate-500 text-sm">Total Slots</p>
            <p class="text-2xl font-bold text-slate-800">10</p>
        </div>
        <div class="bg-white rounded-xl shadow p-5 text-center">
            <p class="text-slate-500 text-sm">Available</p>
            <p id="availableCount" class="text-2xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white rounded-xl shadow p-5 text-center">
            <p class="text-slate-500 text-sm">Occupied</p>
            <p id="occupiedCount" class="text-2xl font-bold text-red-600">0</p>
        </div>
        <div class="bg-white rounded-xl shadow p-5 text-center">
            <p class="text-slate-500 text-sm">Rate</p>
            <p class="text-2xl font-bold text-slate-800">₹20/hr</p>
        </div>
    </section>

    <!-- Alert -->
    <div id="alertBox" class="hidden mb-6 p-4 rounded-lg text-center font-medium"></div>

    <!-- Control Panel -->
    <section class="bg-white rounded-xl shadow p-6 mb-10">
        <h2 class="text-lg font-semibold text-slate-700 mb-4">
            Vehicle Control
        </h2>

        <div class="flex flex-col sm:flex-row gap-4">
            <input
                type="text"
                id="carNumber"
                placeholder="Enter Vehicle Number"
                class="flex-1 border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                onclick="parkCar()"
                class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition"
            >
                Park Vehicle
            </button>

            <button
                onclick="removeCar()"
                class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700 transition"
            >
                Remove Vehicle
            </button>
        </div>
    </section>

    <!-- Slots -->
    <section>
        <h2 class="text-xl font-semibold text-slate-700 mb-4">
            Parking Slots
        </h2>

        <div id="slots" class="grid grid-cols-2 sm:grid-cols-5 gap-5"></div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
