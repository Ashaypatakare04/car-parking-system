<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Smart Car Parking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1",
                        success: "#22c55e",
                        danger: "#ef4444",
                        glass: "rgba(255,255,255,0.6)"
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">

<!-- App Wrapper -->
<div class="min-h-screen backdrop-blur-md bg-glass">

    <!-- Top Bar -->
    <header class="px-6 py-5 flex justify-between items-center">
        <h1 class="text-white text-2xl font-bold">
            🚗 Smart Parking
        </h1>
        <span class="px-4 py-1 rounded-full bg-white/30 text-white text-sm">
            Live Dashboard
        </span>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 pb-10">

        <!-- Stats -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
            <div class="stat-card">
                <p>Total Slots</p>
                <h2>10</h2>
            </div>
            <div class="stat-card text-green-600">
                <p>Available</p>
                <h2 id="availableCount">0</h2>
            </div>
            <div class="stat-card text-red-500">
                <p>Occupied</p>
                <h2 id="occupiedCount">0</h2>
            </div>
            <div class="stat-card">
                <p>Rate</p>
                <h2>₹20/hr</h2>
            </div>
        </section>

        <!-- Alert -->
        <div id="alertBox" class="hidden mb-6"></div>

        <!-- Control Panel -->
        <section class="glass-card mb-12">
            <h3 class="section-title">Vehicle Control</h3>

            <div class="flex flex-col md:flex-row gap-4">
                <input
                    id="carNumber"
                    placeholder="Vehicle Number (MH12AB1234)"
                    class="flex-1 px-4 py-3 rounded-xl bg-white/70 focus:outline-none focus:ring-2 focus:ring-primary"
                />

                <button onclick="parkCar()" class="btn-success">
                    Park Vehicle
                </button>

                <button onclick="removeCar()" class="btn-danger">
                    Remove Vehicle
                </button>
            </div>
        </section>

        <!-- Slots -->
        <section>
            <h3 class="section-title text-white mb-6">
                Parking Slots
            </h3>

            <div
                id="slots"
                class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6"
            ></div>
        </section>

    </main>
</div>

<!-- UI Utilities -->
<style>
    .glass-card {
        background: rgba(255,255,255,0.6);
        backdrop-filter: blur(12px);
        border-radius: 1.5rem;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .stat-card {
        background: rgba(255,255,255,0.65);
        backdrop-filter: blur(10px);
        border-radius: 1.25rem;
        padding: 1.25rem;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .stat-card p {
        font-size: 0.85rem;
        color: #475569;
    }

    .stat-card h2 {
        font-size: 1.75rem;
        font-weight: 700;
    }

    .section-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 1rem;
    }

    .btn-success {
        background: linear-gradient(to right, #22c55e, #16a34a);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-danger {
        background: linear-gradient(to right, #ef4444, #dc2626);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-success:hover,
    .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
</style>

<script src="script.js"></script>
</body>
</html>
