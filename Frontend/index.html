<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Parking System — Dark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>
/* ================= GLOBAL ================= */
html, body {
  height: 100%;
  font-family: Inter, system-ui, sans-serif;
  overflow-x: hidden;
}

/* ================= BACKGROUND ================= */
.hero-bg {
  background:
    linear-gradient(
      to bottom,
      rgba(2,6,23,0.55),
      rgba(2,6,23,0.75)
    ),
    radial-gradient(circle at 20% 30%, rgba(99,102,241,0.25), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(139,92,246,0.25), transparent 50%),
    url("https://images.unsplash.com/photo-1506521781263-d8422e82f27a");

  background-size: cover;
  background-position: center;
  animation: moveBg 24s ease-in-out infinite alternate;
}

@keyframes moveBg {
  to {
    background-position:
      center,
      20% 10%,
      80% 70%,
      center;
  }
}

/* ================= GLASS CARD ================= */
.glass {
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.02)
  );
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
  border: 1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.55),
    inset 0 0 60px rgba(255,255,255,0.03),
    0 0 0 1px rgba(255,255,255,0.06);

  animation: floatCard 6s ease-in-out infinite;
  position: relative;
  transition: transform 0.4s ease;
}

.glass:hover {
  transform: translateY(-6px) scale(1.01);
}

@keyframes floatCard {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.06),
    transparent 60%
  );
  pointer-events: none;
}

/* ================= BUTTON ================= */
.glow-btn {
  background: linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
  background-size: 200% 200%;
  animation: glowMove 8s ease infinite;
  box-shadow: 0 20px 50px rgba(99,102,241,.45);
}

@keyframes glowMove {
  to { background-position: 100% 50%; }
}

.glow-btn:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow:
    0 25px 60px rgba(99,102,241,0.6),
    0 0 40px rgba(236,72,153,0.35);
}

/* secondary button */
.secondary-btn {
  background: rgba(255,255,255,0.03);
}
.secondary-btn:hover {
  background: rgba(255,255,255,0.08);
}

/* ================= SCROLL REVEAL ================= */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.9s ease, transform 0.9s ease;
}

.reveal.show {
  opacity: 1;
  transform: translateY(0);
}

.reveal.delay-1 { transition-delay: 0.15s; }
.reveal.delay-2 { transition-delay: 0.3s; }
.reveal.delay-3 { transition-delay: 0.45s; }

@media (prefers-reduced-motion: reduce) {
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
}
</style>
</head>

<body class="hero-bg flex items-center justify-center text-white relative min-h-screen">

<!-- VIGNETTE -->
<div class="pointer-events-none fixed inset-0
bg-[radial-gradient(circle_at_center,transparent_40%,rgba(0,0,0,0.55))]">
</div>

<!-- NOISE -->
<div class="pointer-events-none fixed inset-0 opacity-[0.04]"
style="background-image:url('https://www.transparenttextures.com/patterns/noise.png')">
</div>

<!-- HERO CARD -->
<div class="glass w-full max-w-4xl mx-6 p-14 rounded-[36px] text-center z-10">

  <!-- TITLE -->
  <h1 class="text-4xl md:text-6xl font-extrabold mb-6
  bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400
  bg-clip-text text-transparent reveal">
    Smart Parking System
  </h1>

  <!-- SUBTITLE -->
  <p class="text-lg md:text-xl text-indigo-200 mb-12 max-w-2xl mx-auto reveal delay-1">
    A futuristic, role-based parking management platform
    designed for modern smart cities
  </p>

  <!-- CTA -->
  <div class="flex justify-center gap-8 flex-wrap reveal delay-2">
    <a href="auth-dark.html"
      class="glow-btn px-12 py-4 rounded-2xl font-semibold text-white">
      Enter System
    </a>

    <a href="#features"
      class="secondary-btn px-12 py-4 rounded-2xl border border-white/30 transition">
      View Concept
    </a>
  </div>

  <!-- TECH STACK -->
  <div class="mt-14 flex justify-center gap-4 text-sm text-indigo-200 opacity-80 reveal delay-3">
    <span>HTML</span>
    <span>Tailwind CSS</span>
    <span>Firebase Auth</span>
    <span>Firestore</span>
  </div>

  <!-- MICRO COPY -->
  <p class="mt-10 text-xs tracking-widest uppercase opacity-60 reveal delay-3">
    Design-heavy portfolio project · Real-world authentication flow
  </p>
</div>

<!-- SCROLL HINT -->
<p class="absolute bottom-6 left-1/2 -translate-x-1/2 text-xs opacity-50">
  Scroll to explore
</p>

<!-- ================= REVEAL SCRIPT ================= -->
<script>
const reveals = document.querySelectorAll(".reveal");

const observer = new IntersectionObserver(
  entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.15 }
);

reveals.forEach(el => observer.observe(el));
</script>

</body>
</html>
