<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>SlotSync — Smart Slot Management</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Your Firebase Config -->
<script src="assets/js/firebase.js"></script>

<!-- Tailwind -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

<style>
body {
  font-family: 'Inter', sans-serif;
  background:
    linear-gradient(to bottom, rgba(2,6,23,0.65), rgba(2,6,23,0.9)),
    url("https://images.unsplash.com/photo-1506521781263-d8422e82f27a");
  background-size: cover;
  background-position: center;
}

.brand { font-family: 'Space Grotesk', sans-serif; }

.auth-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
  backdrop-filter: blur(26px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 28px;
  box-shadow: 0 40px 90px rgba(0,0,0,0.6);
}

.input {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
}
.input::placeholder { color: rgba(255,255,255,0.55); }

.primary-btn {
  background: linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
  font-weight: 600;
}
</style>
</head>

<body class="min-h-screen text-white flex flex-col lg:flex-row">

<!-- LEFT PANEL -->
<section class="flex-1 flex items-center px-12 py-20">
<div class="max-w-xl">

<h1 class="brand text-5xl font-bold mb-3
bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400
bg-clip-text text-transparent">
SlotSync
</h1>

<p class="text-lg text-indigo-100 mb-8 max-w-md">
Real-time slot synchronization and smart parking management platform.
</p>

<ul class="space-y-3 text-indigo-200 text-sm">
<li>• Live slot availability tracking</li>
<li>• Admin & user role dashboards</li>
<li>• Real-time Firebase sync</li>
<li>• Secure authentication flow</li>
</ul>

</div>
</section>

<!-- RIGHT PANEL -->
<section class="flex-1 flex items-center justify-center px-6 py-20">
<div class="auth-card w-full max-w-md p-10">

<!-- Toggle -->
<div class="flex mb-8 bg-white/10 rounded-xl p-1 text-sm">
<button id="showLogin" class="flex-1 py-2 rounded-lg bg-white/20 font-medium">
Sign In
</button>
<button id="showSignup" class="flex-1 py-2 rounded-lg opacity-70">
Sign Up
</button>
</div>

<!-- LOGIN -->
<div id="loginSection">
<form id="loginForm" class="space-y-4">

<input id="loginEmail" type="email" placeholder="Email"
class="input w-full px-4 py-3 rounded-lg">

<input id="loginPassword" type="password" placeholder="Password"
class="input w-full px-4 py-3 rounded-lg">

<!-- Role Select UI (no logic change) -->
<select id="loginRole"
class="input w-full px-4 py-3 rounded-lg">
<option value="user">Login as User</option>
<option value="admin">Login as Admin</option>
</select>

<div class="text-right text-sm">
<a href="#" id="forgotPassword" class="text-indigo-300 hover:underline">
Forgot password?
</a>
</div>

<button class="primary-btn w-full py-3 rounded-xl">
Sign In
</button>

<button id="googleSignIn" type="button"
class="w-full py-3 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center gap-3 text-sm">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
Continue with Google
</button>

</form>
</div>

<!-- SIGNUP -->
<div id="signupSection" class="hidden">
<form id="signupForm" class="space-y-4">

<input id="signupEmail" type="email" placeholder="Email"
class="input w-full px-4 py-3 rounded-lg">

<input id="signupPassword" type="password" placeholder="Password"
class="input w-full px-4 py-3 rounded-lg">

<input id="signupConfirm" type="password" placeholder="Confirm Password"
class="input w-full px-4 py-3 rounded-lg">

<!-- Role Select UI -->
<select id="signupRole"
class="input w-full px-4 py-3 rounded-lg">
<option value="user">Create User Account</option>
<option value="admin">Create Admin Account</option>
</select>

<button class="primary-btn w-full py-3 rounded-xl">
Create Account
</button>

</form>
</div>

</div>
</section>

<!-- Login Logic -->
<script src="assets/js/login.js"></script>

</body>
</html>
