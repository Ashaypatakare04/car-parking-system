<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlotSync • Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/img/SlotSync_2.png">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: "#070911",
        primary: "#7c7cff",
        green: "#2bff88",
        text: "#e5e7eb",
        muted: "#9ca3af"
      }
    }
  }
}
</script>
</head>

<body class="bg-bg text-text overflow-x-hidden">

<!-- Background Glow -->
<div class="fixed inset-0 -z-10">
  <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-primary/20 blur-[180px]"></div>
  <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-fuchsia-600/10 blur-[180px]"></div>
</div>

<div class="max-w-7xl mx-auto px-6 py-10">

<!-- Header -->
<header class="flex items-center justify-between mb-14">
  <div>
    <h1 class="text-3xl font-bold tracking-wide">📊 Analytics Dashboard</h1>
    <p class="text-muted text-sm mt-1">Usage trends & revenue insights</p>
  </div>

  <div class="flex gap-3">
    <button onclick="exportCSV()"
      class="btn-outline">
      EXPORT CSV
    </button>

    <button onclick="location.href='home.html'"
      class="btn-outline">
      BACK
    </button>
  </div>
</header>

<!-- Filters -->
<section class="flex flex-wrap gap-3 mb-12">
  <button class="filter active" data-range="7d">7 DAYS</button>
  <button class="filter" data-range="30d">30 DAYS</button>
  <button class="filter" data-range="all">ALL TIME</button>
</section>

<!-- KPI Cards -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-16">

  <div class="card glow">
    <p class="label">AVG OCCUPANCY</p>
    <h2 id="avgOcc" class="value">–</h2>
  </div>

  <div class="card">
    <p class="label">PEAK HOUR</p>
    <h2 id="peakHour" class="value">–</h2>
  </div>

  <div class="card">
    <p class="label">DAILY USERS</p>
    <h2 id="dailyUsers" class="value">–</h2>
  </div>

  <div class="card">
    <p class="label">EST. REVENUE</p>
    <h2 id="revenue" class="value text-green">–</h2>
  </div>

</section>

<!-- Charts -->
<section class="grid grid-cols-1 lg:grid-cols-2 gap-10">

  <div class="card">
    <p class="section-title mb-6">Usage Over Time</p>
    <div class="relative h-[300px]">
      <canvas id="usageChart"></canvas>
    </div>
  </div>

  <div class="card">
    <p class="section-title mb-6">Slot Distribution</p>
    <div class="relative h-[300px]">
      <canvas id="slotChart"></canvas>
    </div>
  </div>

</section>

</div>

<!-- Styles -->
<style>
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:1.6rem;
  padding:1.8rem;
  transition:.3s ease;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.glow{ box-shadow:0 0 40px rgba(124,124,255,.35); }

.label{
  font-size:.7rem;
  letter-spacing:.22em;
  color:#9ca3af;
}
.value{
  font-size:1.9rem;
  font-weight:700;
}
.section-title{
  font-size:1.05rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#c7d2fe;
}

.filter{
  padding:.6rem 1.3rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  font-size:.75rem;
  letter-spacing:.18em;
  transition:.2s;
}
.filter.active,
.filter:hover{
  background:#7c7cff;
  color:black;
  border-color:#7c7cff;
}

.btn-outline{
  padding:.5rem 1.2rem;
  border-radius:999px;
  border:1px solid rgba(124,124,255,.4);
  font-size:.75rem;
  letter-spacing:.18em;
  transition:.2s;
}
.btn-outline:hover{
  background:#7c7cff;
  color:black;
}
</style>

<script src="assets/js/analytics.js"></script>

</body>
</html>
