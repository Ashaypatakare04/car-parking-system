<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlotSync • Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/img/SlotSync_2.png">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: "#070911",
        panel: "rgba(255,255,255,0.06)",
        stroke: "rgba(255,255,255,0.12)",
        primary: "#7c7cff",
        green: "#2bff88",
        red: "#ff4d6d",
        yellow: "#facc15",
        text: "#e5e7eb",
        muted: "#9ca3af"
      }
    }
  }
}
</script>
</head>

<body class="bg-bg text-text">

<!-- BACKGROUND -->
<div class="fixed inset-0 -z-10">
  <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-primary/20 blur-[180px]"></div>
  <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-fuchsia-600/10 blur-[180px]"></div>
</div>

<div class="max-w-7xl mx-auto px-6 py-8">

<!-- HEADER -->
<header class="flex items-center justify-between mb-14">
  <div>
    <h1 class="text-2xl font-semibold tracking-wide">🛠SlotSync Admin</h1>
    <p class="text-muted text-sm">System control & monitoring</p>
  </div>

  <button id="logoutBtn"
    class="px-4 py-2 rounded-full border border-primary/40 text-primary text-xs tracking-widest hover:bg-primary/10">
    LOGOUT
  </button>
</header>

<!-- OVERVIEW -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-16">

  <div class="card glow">
    <p class="label">TOTAL SLOTS</p>
    <h2 id="totalSlots" class="value">10</h2>
  </div>

  <div class="card">
    <p class="label">ACTIVE USERS</p>
    <h2 class="value">6</h2>
  </div>

  <div class="card">
    <p class="label">OCCUPANCY</p>
    <h2 id="occupancy" class="value text-green">0%</h2>
  </div>

  <div class="card">
    <p class="label">SYSTEM MODE</p>
    <h2 id="systemMode" class="value text-green">LIVE</h2>
  </div>

</section>

<!-- SLOT MANAGEMENT -->
<section class="card mb-16">
  <h3 class="section-title">Parking Configuration</h3>

  <div class="flex flex-col md:flex-row gap-4">
    <input id="slotInput" type="number" min="1"
      placeholder="Set total slots"
      class="input" />

    <button class="btn btn-green" onclick="updateSlots()">
      Update Capacity
    </button>

    <button class="btn btn-yellow" onclick="toggleMaintenance()">
      Toggle Maintenance
    </button>

    <button class="btn btn-red" onclick="resetSystem()">
      Reset System
    </button>
  </div>
</section>

<!-- ACTIVITY LOG -->
<section class="mb-16">
  <h3 class="section-title mb-4">Admin Activity</h3>

  <div id="activityLog" class="space-y-3">
    <!-- logs -->
  </div>
</section>

<!-- USERS -->
<section>
  <h3 class="section-title mb-6">Registered Users</h3>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <div class="card">
      <p class="label">USER</p>
      <p class="value text-base">admin@SlotSync.io</p>
      <p class="text-muted text-sm">Role: Admin</p>
    </div>

    <div class="card">
      <p class="label">USER</p>
      <p class="value text-base">user1@gmail.com</p>
      <p class="text-muted text-sm">Role: User</p>
    </div>

  </div>
</section>

</div>

<!-- STYLES -->
<style>
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:1.4rem;
  padding:1.6rem;
  transition:.35s ease;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 25px 60px rgba(0,0,0,.6);
}
.glow{ box-shadow:0 0 40px rgba(124,124,255,.35); }

.label{
  font-size:.7rem;
  letter-spacing:.2em;
  color:#9ca3af;
}
.value{
  font-size:1.6rem;
  font-weight:600;
}
.section-title{
  font-size:1.05rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#c7d2fe;
}
.input{
  flex:1;
  padding:1rem 1.2rem;
  border-radius:1rem;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  color:#e5e7eb;
}
.btn{
  padding:1rem 1.6rem;
  border-radius:1rem;
  font-weight:500;
  transition:.25s ease;
}
.btn-green{ background:linear-gradient(135deg,#2bff88,#16c172); }
.btn-red{ background:linear-gradient(135deg,#ff4d6d,#eca50e); }
.btn-yellow{ background:linear-gradient(135deg,#facc15,#eab308); }
.btn:hover{ transform:scale(1.06); }
</style>

<script src="assets/js/admin.js"></script>

</body>
</html>
